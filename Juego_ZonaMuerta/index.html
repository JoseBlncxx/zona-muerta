<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zona Muerta</title>
<meta name="description" content="Juego de zombis con vista desde arriba: 13 niveles, 9 mapas, 10 jefes, 9 armas, supervivencia, tienda y compañeros.">
<meta name="theme-color" content="#12180e">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zona Muerta">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    font-family: 'Segoe UI', Arial, sans-serif; color: #eee; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0b0f08; color: #9bd14b;
    align-items: center; justify-content: center; flex-direction: column; text-align: center; font-size: 22px; font-weight: bold; }
  #rotate span { font-size: 64px; margin-bottom: 12px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  canvas.playing { cursor: none; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.45), rgba(0,0,0,.85)); }
  #overlay.hidden { display: none; }
  .panel { background: rgba(14,18,12,.93); border: 2px solid #5f8a2e; border-radius: 14px;
    padding: 30px 44px; text-align: center; max-width: 760px; width: calc(100% - 64px);
    box-shadow: 0 0 50px rgba(110,190,50,.25), inset 0 0 30px rgba(0,0,0,.6); }
  h1 { font-size: 68px; margin: 0 0 4px; color: #9bd14b; letter-spacing: 6px;
    text-shadow: 0 0 22px #3f6b12, 4px 4px 0 #400; }
  h2 { font-size: 36px; margin: 0 0 12px; color: #c8e86b; }
  p { color: #bbb; line-height: 1.5; margin: 8px 0; }
  .sub { color: #a33; font-weight: bold; letter-spacing: 3px; margin-bottom: 22px; }
  button { display: block; width: 280px; margin: 10px auto; padding: 13px; font-size: 20px; font-weight: bold;
    background: linear-gradient(#4d7a22, #2f4f13); color: #fff; border: 2px solid #8ec74a; border-radius: 8px;
    cursor: pointer; letter-spacing: 1px; transition: transform .1s, filter .1s; }
  button:hover { transform: scale(1.05); filter: brightness(1.2); }
  button:disabled { background: #333; border-color: #555; color: #777; cursor: not-allowed; transform: none; filter: none; }
  button.red { background: linear-gradient(#8a2020, #4f0f0f); border-color: #d05050; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0; }
  .grid button { width: 100%; margin: 0; font-size: 15px; padding: 14px 6px; }
  .grid button small { display: block; font-weight: normal; font-size: 12px; opacity: .8; margin-top: 4px; }
  table { margin: 10px auto; border-collapse: collapse; text-align: left; }
  td { padding: 5px 14px; color: #ccc; }
  td.k { color: #9bd14b; font-weight: bold; text-align: right; }
  .stats { font-size: 20px; color: #ddd; margin: 14px 0; }
  .stats b { color: #ffd34d; }
  .coins { color: #ffd34d; font-weight: bold; font-size: 18px; margin: 4px 0 10px; }
  .panel.wide { max-width: 980px; }
  .shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; max-height: 58vh; overflow-y: auto; padding: 4px; margin-bottom: 8px; text-align: left; }
  .sect { grid-column: 1 / -1; color: #9bd14b; font-weight: bold; letter-spacing: 2px; border-bottom: 1px solid #3f5f1e; padding: 6px 0 2px; text-transform: uppercase; font-size: 13px; }
  .card { background: rgba(40,50,30,.8); border: 1px solid #4f6f2a; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .card.owned { border-color: #9bd14b; background: rgba(60,80,30,.7); }
  .card b { color: #fff; font-size: 15px; } .card small { color: #bbb; font-size: 12px; line-height: 1.3; flex: 1; } .card i { color: #9bd14b; font-size: 12px; font-style: normal; }
  .card button { width: 100%; margin: 4px 0 0; padding: 7px; font-size: 15px; }
  .card .tag { color: #9bd14b; font-weight: bold; font-size: 13px; text-align: center; padding: 7px 0 0; }
  .card.wide { grid-column: span 2; } .card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .row button { width: auto; min-width: 90px; margin: 3px 0; padding: 5px 8px; font-size: 13px; }
  button.small { padding: 5px; font-size: 13px; }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .menu-grid button { width: 100%; margin: 0; font-size: 17px; padding: 11px 6px; }
  .menu-grid button.big { font-size: 19px; padding: 14px 6px; }
  button small { display: block; font-weight: normal; font-size: 12px; opacity: .85; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 4px 0 10px; }
  .tabs button { width: auto; margin: 0; padding: 7px 12px; font-size: 14px; background: #2a3a1a; }
  .tabs button.on { background: linear-gradient(#6d9a32, #3f6f13); border-color: #c8e86b; }
  .xpbar { height: 14px; background: #1a2a3a; border: 1px solid #7fd0ff; border-radius: 7px; overflow: hidden; margin: 6px auto; max-width: 420px; }
  .xpbar div { height: 100%; background: linear-gradient(90deg, #3fa0e0, #7fd0ff); }
  label.opt { display: flex; justify-content: space-between; align-items: center; gap: 14px; max-width: 420px; margin: 8px auto; color: #ddd; font-weight: bold; }
  label.opt input { flex: 1; max-width: 200px; accent-color: #9bd14b; }
  table.rec { width: 100%; max-width: 560px; } table.rec th { color: #9bd14b; text-align: left; padding: 4px 10px; } table.rec td { padding: 4px 10px; }
  .bigstars { font-size: 46px; color: #ffd34d; letter-spacing: 6px; text-shadow: 0 0 12px rgba(255,200,0,.5); }
  .grid .st { color: #ffd34d; font-size: 14px; letter-spacing: 2px; }
  p.story { font-size: 18px; color: #e8e8d8; font-style: italic; max-width: 600px; margin: 14px auto; }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; border: 1px solid #fff; }
  /* pantallas bajitas (celular en horizontal) */
  @media (max-height: 520px) {
    .panel { padding: 12px 22px; max-height: 94vh; overflow-y: auto; }
    h1 { font-size: 38px; letter-spacing: 4px; } h2 { font-size: 24px; margin-bottom: 6px; } .sub { margin-bottom: 8px; font-size: 12px; }
    button { padding: 7px; font-size: 16px; margin: 6px auto; width: 260px; }
    .grid { grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 8px 0; }
    .grid button { padding: 7px 4px; font-size: 13px; }
    .shop { max-height: 52vh; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; } .card { padding: 6px 8px; } .coins { margin: 2px 0 6px; font-size: 15px; }
    td { padding: 2px 10px; font-size: 13px; } p { margin: 4px 0; font-size: 13px; } .stats { font-size: 15px; margin: 8px 0; }
    .menu-grid { gap: 6px; margin: 6px 0; } .menu-grid button, .menu-grid button.big { font-size: 14px; padding: 7px 4px; }
    .tabs button { padding: 5px 8px; font-size: 12px; } p.story { font-size: 14px; margin: 6px auto; } .bigstars { font-size: 32px; }
    .card.wide { grid-column: span 1; } label.opt { margin: 4px auto; font-size: 14px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"></div>
<div id="rotate"><span>📱↻</span>Gira tu celular<br>para jugar en horizontal</div>
<script src="core.js"></script>
<script src="mapas.js"></script>
<script src="datos.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
